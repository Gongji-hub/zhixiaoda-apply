<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>简历与模型 · 职小搭</title><link rel="stylesheet" href="settings.css"></head>
<body><main><header><img src="../icon-32.png" width="32" height="32" alt=""><span>职小搭 · 网申助手</span></header><h1>简历与模型</h1>
<form id="settings"><fieldset><legend>申请资料</legend><label for="file">导入简历</label><input type="file" id="file" accept=".pdf,.docx,.txt,.md">
<p>支持文字版 PDF、DOCX、UTF-8 文本和 Markdown，也可以直接粘贴。请核对下方提取的正文，模型将按这份资料填写。</p>
<label for="resume">简历正文</label><textarea id="resume" rows="11" maxlength="80000" required></textarea></fieldset>
<fieldset><legend>模型 API</legend><label for="base">API Base URL</label><input id="base" type="url" placeholder="https://api.example.com/v1" required>
<label for="model">模型名称</label><input id="model" placeholder="服务商提供的模型 ID" required>
<label for="key">API Key</label><input id="key" type="password" autocomplete="off"><p>使用支持工具调用的 Chat Completions 兼容接口。本地免鉴权模型可留空密钥。</p></fieldset>
<p>资料与密钥保存在此浏览器。点击「开始自动填写」后，扩展会把简历、当前表单和本轮回答发送到你配置的模型地址。</p>
<div class="actions"><button id="save">保存设置</button><button id="clear" type="button">清除本地资料与进度</button></div><p id="status" role="status" aria-live="polite"></p>
</form></main><script type="module" src="settings.js"></script></body></html>
